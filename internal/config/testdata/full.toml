[project]
name = "myapp"

[stack]
type = "laravel"
php = "8.3"
node = "22"
services = ["redis", "mailpit", "s3"]

[dev.ports]
laravel = 8000
vite = 5173
redis = 6379

[deploy.production]
host = "prod.example.com"
user = "deploy"
path = "/srv/myapp"
branch = "main"
port = 8282
domain = "myapp.example.com"

[deploy.production.ports]
laravel = 8383

[deploy.staging]
host = "staging.example.com"
user = "deploy"
path = "/srv/myapp-staging"
branch = "develop"
domain = "staging.myapp.example.com"

[deploy.staging.ports]
laravel = 8443
