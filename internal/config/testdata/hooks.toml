[project]
name = "myapp"
domain = "myapp.example.com"

[stack]
type = "laravel"
php = "8.3"
node = "22"

[deploy.production]
host = "prod.example.com"
user = "deploy"
path = "/srv/myapp"
branch = "main"
before_deploy = ["php artisan down"]
after_deploy = ["php artisan migrate --force", "php artisan cache:clear"]
