[project]
name = "myapp"
domain = "myapp.example.com"

[stack]
type = "laravel"
php = "8.3"
node = "22"
services = ["redis", "mailpit", "s3"]

[dev.ports]
laravel = 8080
vite = 5174

[deploy.production]
host   = "prod.example.com"
user   = "deploy"
path   = "/srv/myapp"
branch = "main"
domain = "myapp.example.com"
extra_domains = ["www.myapp.example.com"]

[deploy.production.ports]
laravel = 8383
