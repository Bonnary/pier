[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
# Naming each process lets numprocs run more than one worker
# (supervisord requires %(process_num)s in process_name when
# numprocs > 1). The queue service injects SUPERVISOR_NUMPROCS
# from queue_workers; the Dockerfile default of 1 keeps the app
# and scheduler single-process.
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_SUPERVISOR_NUMPROCS)s
# Always restart: a Laravel worker that exits 0 (queue:restart,
# or a lost-connection stop in newer Laravel) is 'expected' under
# the default autorestart=unexpected and would stay dead forever.
autorestart=true
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
