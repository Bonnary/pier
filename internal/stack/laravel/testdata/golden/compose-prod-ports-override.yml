services:
    app:
        build:
            context: ./docker/8.3
            dockerfile: Dockerfile
        image: myapp:latest
        environment:
            APP_DEBUG: "false"
            APP_ENV: production
            REDIS_HOST: redis
            REDIS_PORT: "6379"
        networks:
            - pier
        depends_on:
            - redis
        restart: unless-stopped
    redis:
        image: redis:7-alpine
        ports:
            - 6379:6379
        volumes:
            - redis_data:/data
        networks:
            - pier
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: "5"
            start_period: 10s
        restart: unless-stopped
    webserver:
        image: nginx:alpine
        ports:
            - 8383:443
            - 80:80
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        networks:
            - pier
        depends_on:
            - app
        restart: unless-stopped
networks:
    pier:
        driver: bridge
volumes:
    redis_data:
        driver: local
