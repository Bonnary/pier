services:
    laravel.test:
        build:
            context: ./docker/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: "1000"
        image: myapp/test:latest
        ports:
            - 127.0.0.1:8000:8000
            - 127.0.0.1:5173:5173
        environment:
            APP_DEBUG: "true"
            APP_ENV: local
            DB_CONNECTION: sqlite
        volumes:
            - ./:/var/www/html
        extra_hosts:
            - host.docker.internal:host-gateway
        networks:
            - pier
networks:
    pier:
        driver: bridge
